# DDEV override: local-dev Shibboleth auth simulation.
# Merged on top of config.yaml by DDEV. Lives under .ddev/ — never deployed.
#
# APP_ENV gates the auth mock (.ddev/php/shib_dev_prepend.php); it defaults to
# "production" off-DDEV, so the mock cannot activate outside local development.
# MOCK_* seed the Shibboleth attributes the certificate flow reads
# (certificate/giveYourselfCredit.php uses mail/nickname/sn).
web_environment:
  - APP_ENV=local
  - MOCK_CN=teststudent
  - MOCK_MAIL=teststudent@stonybrook.edu
  - MOCK_NICKNAME=Test
  - MOCK_SN=Student
