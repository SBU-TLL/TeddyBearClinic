; DDEV-only PHP settings for TeddyBearClinic local development.
; Loaded ONLY inside the DDEV container — never deployed to Azure.
;
; - short_open_tag: several certificate/*.php files use the legacy `<?` short tag.
;   request (no application source edited). It is fail-closed / APP_ENV-gated.
short_open_tag = On

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_STRICT
